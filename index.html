<!DOCTYPE html>
<html lang="en" dir="ltr" id="htmlRoot">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PRIME POINTS \u2014 PRIME STRENGTH</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet"/>
<style>
:root{
  --black:#050505;--dark:#0d0d0d;--card:#111111;--card2:#161616;
  --border:rgba(255,255,255,0.07);
  --gold:#c9a84c;--gold2:#f0c040;--gold-glow:rgba(201,168,76,0.35);
  --purple:#9b5de5;--purple2:#c77dff;--purple-glow:rgba(155,93,229,0.35);
  --white:#f8f8f8;--gray:#888;--silver:#c0c0c0;--bronze:#cd7f32;
  --font-display:'Bebas Neue',sans-serif;
  --font-body:'Rajdhani',sans-serif;
  --font-tech:'Orbitron',sans-serif;
  --font-ar:'Cairo',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--black);color:var(--white);font-family:var(--font-body);font-size:16px;overflow-x:hidden;}
[lang="ar"] body,[dir="rtl"] .ar-text{font-family:var(--font-ar);}
.ar-only{display:none!important;}.en-only{display:block;}
html[lang="ar"] .ar-only{display:block!important;}
html[lang="ar"] .en-only{display:none!important;}
html[lang="ar"] .ar-inline{display:inline!important;}
html[lang="ar"] .en-inline{display:none!important;}
.ar-inline{display:none;}.en-inline{display:inline;}
/* RTL flip */
html[lang="ar"]{direction:rtl;}
html[lang="ar"] .nav-right{flex-direction:row-reverse;}
html[lang="ar"] .history-item,.lb-item{flex-direction:row-reverse;}
html[lang="ar"] .rank-top{flex-direction:row-reverse;}
html[lang="ar"] .referral-code-wrap{flex-direction:row-reverse;}
html[lang="ar"] .mission-top{flex-direction:row-reverse;}
html[lang="ar"] .reward-cost{flex-direction:row-reverse;}
html[lang="ar"] .dash-tabs{flex-direction:row-reverse;}
html[lang="ar"] .section-sub{text-align:right;}
html[lang="ar"] .dash-card-label,html[lang="ar"] .dash-card-sub{text-align:right;}
html[lang="ar"] .progress-labels{flex-direction:row-reverse;}
html[lang="ar"] .rank-perks{justify-content:flex-end;}
html[lang="ar"] .hero-eyebrow,html[lang="ar"] .hero-sub{font-family:var(--font-ar);}
html[lang="ar"] .section-tag{font-family:var(--font-ar);letter-spacing:1px;}
html[lang="ar"] .modal-sub,html[lang="ar"] .mission-desc,html[lang="ar"] .reward-desc,html[lang="ar"] .referral-desc{font-family:var(--font-ar);text-align:right;}
html[lang="ar"] .form-group label{text-align:right;direction:rtl;}
html[lang="ar"] .form-group input{text-align:right;direction:rtl;}
html[lang="ar"] .level-perks li{flex-direction:row-reverse;}
html[lang="ar"] .level-range,.level-name{text-align:right;}
html[lang="ar"] .dash-welcome{text-align:right;}
html[lang="ar"] .panel-heading{flex-direction:row-reverse;}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-track{background:#0a0a0a;}
::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px;}
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.4;}

/* LANGUAGE TOGGLE */
.lang-toggle{
  display:flex;align-items:center;gap:0;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  border-radius:4px;overflow:hidden;
}
.lang-btn{
  background:transparent;border:none;
  color:var(--gray);font-family:var(--font-body);
  font-weight:700;font-size:.78rem;letter-spacing:2px;
  padding:8px 14px;cursor:pointer;transition:all .25s;
}
.lang-btn.active{background:var(--gold);color:#000;}
.lang-btn:hover:not(.active){color:var(--white);}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:1000;display:flex;align-items:center;justify-content:space-between;padding:16px 40px;background:rgba(5,5,5,0.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);}
.nav-logo{font-family:var(--font-display);font-size:1.5rem;letter-spacing:4px;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.nav-logo span{-webkit-text-fill-color:var(--white);}
.nav-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.nav-btn{background:transparent;border:1px solid var(--border);color:var(--white);font-family:var(--font-body);font-weight:600;font-size:.8rem;letter-spacing:2px;text-transform:uppercase;padding:9px 20px;border-radius:3px;cursor:pointer;transition:all .3s;}
.nav-btn:hover{border-color:var(--gold);color:var(--gold);}
.nav-btn.gold{background:var(--gold);border-color:var(--gold);color:#000;font-weight:700;}
.nav-btn.gold:hover{background:var(--gold2);box-shadow:0 0 20px var(--gold-glow);}
html[lang="ar"] .nav-btn{font-family:var(--font-ar);letter-spacing:0;}

section{padding:90px 40px;max-width:1200px;margin:0 auto;}
.section-tag{font-family:var(--font-tech);font-size:.6rem;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-bottom:12px;}
.section-title{font-family:var(--font-display);font-size:clamp(2.5rem,6vw,5rem);letter-spacing:4px;line-height:1;margin-bottom:16px;}
html[lang="ar"] .section-title{font-family:var(--font-ar);font-weight:900;letter-spacing:0;}
.section-sub{color:var(--gray);font-size:1rem;letter-spacing:1px;max-width:560px;line-height:1.7;margin-bottom:50px;}

/* HERO */
#hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden;padding:140px 40px 80px;max-width:100%;}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(201,168,76,0.08) 0%,transparent 60%),radial-gradient(ellipse 60% 40% at 80% 80%,rgba(155,93,229,0.06) 0%,transparent 50%),var(--black);}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 30%,transparent 80%);}
.hero-eyebrow{font-family:var(--font-tech);font-size:.65rem;letter-spacing:8px;color:var(--gold);margin-bottom:24px;position:relative;}
.hero-title{font-family:var(--font-display);font-size:clamp(4rem,12vw,9rem);letter-spacing:8px;line-height:.95;position:relative;}
.hero-title .line2{background:linear-gradient(135deg,var(--gold),var(--gold2),var(--purple2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:block;}
.hero-sub{margin-top:20px;font-size:1.05rem;color:var(--gray);letter-spacing:2px;font-weight:500;position:relative;max-width:600px;}
.hero-ctas{display:flex;gap:16px;margin-top:40px;flex-wrap:wrap;justify-content:center;position:relative;}
.btn-primary{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;font-family:var(--font-body);font-weight:700;font-size:.9rem;letter-spacing:3px;text-transform:uppercase;border:none;padding:16px 36px;border-radius:3px;cursor:pointer;transition:all .35s;position:relative;overflow:hidden;}
.btn-primary::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent,rgba(255,255,255,0.2),transparent);transform:translateX(-100%);transition:transform .5s;}
.btn-primary:hover{box-shadow:0 0 30px var(--gold-glow),0 0 60px rgba(201,168,76,0.15);transform:translateY(-2px);}
.btn-primary:hover::after{transform:translateX(100%);}
html[lang="ar"] .btn-primary{font-family:var(--font-ar);letter-spacing:0;}
.btn-ghost{background:transparent;border:1px solid rgba(255,255,255,0.15);color:var(--white);font-family:var(--font-body);font-weight:600;font-size:.9rem;letter-spacing:3px;text-transform:uppercase;padding:16px 36px;border-radius:3px;cursor:pointer;transition:all .35s;}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold);}
html[lang="ar"] .btn-ghost{font-family:var(--font-ar);letter-spacing:0;}
.hero-stats{display:flex;gap:60px;margin-top:70px;position:relative;flex-wrap:wrap;justify-content:center;}
.hero-stat{text-align:center;}
.hero-stat-num{font-family:var(--font-display);font-size:2.8rem;background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero-stat-label{font-size:.7rem;letter-spacing:3px;color:var(--gray);margin-top:4px;}
html[lang="ar"] .hero-stat-label{font-family:var(--font-ar);letter-spacing:0;}

/* PARTICLES */
.particle{position:absolute;border-radius:50%;pointer-events:none;animation:floatUp linear infinite;}
@keyframes floatUp{0%{transform:translateY(0) rotate(0);opacity:.6;}100%{transform:translateY(-100vh) rotate(360deg);opacity:0;}}

/* MODALS */
.modal-overlay{display:none;position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);align-items:center;justify-content:center;}
.modal-overlay.active{display:flex;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:40px;max-width:480px;width:90%;position:relative;animation:modalIn .4s cubic-bezier(.34,1.56,.64,1);}
@keyframes modalIn{from{transform:scale(.85) translateY(20px);opacity:0;}to{transform:scale(1) translateY(0);opacity:1;}}
.modal-close{position:absolute;top:16px;right:16px;background:transparent;border:none;color:var(--gray);font-size:1.4rem;cursor:pointer;line-height:1;transition:color .2s;}
html[lang="ar"] .modal-close{right:auto;left:16px;}
.modal-close:hover{color:var(--white);}
.modal-title{font-family:var(--font-display);font-size:2rem;letter-spacing:3px;margin-bottom:8px;}
html[lang="ar"] .modal-title{font-family:var(--font-ar);font-weight:900;letter-spacing:0;}
.modal-sub{color:var(--gray);font-size:.9rem;letter-spacing:1px;margin-bottom:28px;line-height:1.6;}
.form-group{margin-bottom:18px;}
.form-group label{display:block;font-size:.75rem;letter-spacing:2px;color:var(--gray);text-transform:uppercase;margin-bottom:8px;}
html[lang="ar"] .form-group label{font-family:var(--font-ar);letter-spacing:0;}
.form-group input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:4px;color:var(--white);font-family:var(--font-body);font-size:1rem;padding:13px 16px;outline:none;transition:border-color .3s;}
.form-group input:focus{border-color:var(--gold);}
.form-group input::placeholder{color:rgba(255,255,255,0.2);}
.form-submit{width:100%;background:linear-gradient(135deg,var(--gold),var(--gold2));border:none;color:#000;font-family:var(--font-body);font-weight:700;font-size:.9rem;letter-spacing:3px;text-transform:uppercase;padding:15px;border-radius:4px;cursor:pointer;transition:all .3s;margin-top:8px;}
.form-submit:hover{box-shadow:0 0 25px var(--gold-glow);}
html[lang="ar"] .form-submit{font-family:var(--font-ar);letter-spacing:0;}
.form-note{text-align:center;font-size:.75rem;color:var(--gray);margin-top:14px;letter-spacing:1px;}
html[lang="ar"] .form-note{font-family:var(--font-ar);}
.form-note a{color:var(--gold);text-decoration:none;}

/* DASHBOARD */
#dashboard{display:none;padding:110px 40px 80px;max-width:1200px;margin:0 auto;}
#dashboard.visible{display:block;}
.dash-header{margin-bottom:40px;}
.dash-welcome{font-family:var(--font-display);font-size:clamp(1.8rem,5vw,3.2rem);letter-spacing:4px;line-height:1.2;}
html[lang="ar"] .dash-welcome{font-family:var(--font-ar);font-weight:900;letter-spacing:0;}
.dash-welcome span{background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.dash-member-tag{display:inline-block;background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.3);color:var(--gold);font-family:var(--font-tech);font-size:.6rem;letter-spacing:4px;padding:5px 14px;border-radius:2px;margin-top:10px;}
html[lang="ar"] .dash-member-tag{font-family:var(--font-ar);letter-spacing:0;}

.dash-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:36px;}
.dash-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:26px;position:relative;overflow:hidden;transition:border-color .3s,transform .3s;}
.dash-card:hover{border-color:rgba(201,168,76,0.3);transform:translateY(-3px);}
.dash-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:0;transition:opacity .3s;}
.dash-card:hover::before{opacity:1;}
.dash-card-icon{font-size:1.6rem;margin-bottom:12px;}
.dash-card-label{font-size:.7rem;letter-spacing:3px;color:var(--gray);text-transform:uppercase;margin-bottom:8px;}
html[lang="ar"] .dash-card-label{font-family:var(--font-ar);letter-spacing:0;}
.dash-card-value{font-family:var(--font-display);font-size:2.2rem;letter-spacing:2px;}
.dash-card-value.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.dash-card-sub{font-size:.8rem;color:var(--gray);margin-top:6px;letter-spacing:1px;}
html[lang="ar"] .dash-card-sub{font-family:var(--font-ar);letter-spacing:0;}

/* RANK */
.rank-display{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:30px;margin-bottom:36px;position:relative;overflow:hidden;}
.rank-bg-text{position:absolute;right:-20px;bottom:-20px;font-family:var(--font-display);font-size:8rem;opacity:.04;letter-spacing:10px;user-select:none;}
.rank-top{display:flex;align-items:center;gap:20px;margin-bottom:24px;flex-wrap:wrap;}
.rank-badge{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:1rem;letter-spacing:2px;flex-shrink:0;}
.rank-badge.bronze{background:linear-gradient(135deg,#7c4a1e,var(--bronze));color:#fff;box-shadow:0 0 20px rgba(205,127,50,0.4);}
.rank-badge.silver{background:linear-gradient(135deg,#888,var(--silver));color:#000;box-shadow:0 0 20px rgba(192,192,192,0.4);}
.rank-badge.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#000;box-shadow:0 0 20px var(--gold-glow);}
.rank-badge.black{background:linear-gradient(135deg,#1a1a1a,#333);color:var(--gold);border:1px solid var(--gold);box-shadow:0 0 20px rgba(201,168,76,0.6);}
.rank-info-name{font-family:var(--font-display);font-size:1.8rem;letter-spacing:3px;}
html[lang="ar"] .rank-info-name{font-family:var(--font-ar);font-weight:900;letter-spacing:0;}
.rank-info-desc{color:var(--gray);font-size:.85rem;letter-spacing:1px;margin-top:4px;}
html[lang="ar"] .rank-info-desc{font-family:var(--font-ar);}
.progress-wrap{margin-top:8px;}
.progress-labels{display:flex;justify-content:space-between;font-size:.75rem;letter-spacing:2px;color:var(--gray);margin-bottom:10px;}
html[lang="ar"] .progress-labels{font-family:var(--font-ar);letter-spacing:0;}
.progress-bar-outer{height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden;}
.progress-bar-inner
